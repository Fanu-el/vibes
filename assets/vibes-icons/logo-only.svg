<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 200" width="140" height="200">
  <defs>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="50%" style="stop-color:#475569"/>
      <stop offset="100%" style="stop-color:#64748B"/>
    </linearGradient>
    <linearGradient id="slateGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#64748B"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(60, 100)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#slateGrad)" stroke-width="4"/>
    
    <!-- Sound wave bars -->
    <rect x="-38" y="-20" width="4" height="20" rx="1.5" fill="#475569" opacity="0.4"/>
    <rect x="-29" y="-25" width="4" height="28" rx="1.5" fill="#64748B" opacity="0.6"/>
    <rect x="-20" y="-28" width="4" height="35" rx="1.5" fill="#94A3B8" opacity="0.8"/>
    
    <!-- Music note -->
    <g transform="translate(5, -5)">
      <ellipse cx="0" cy="10" rx="7" ry="5" fill="url(#slateGrad)"/>
      <rect x="5" y="-22" width="2.5" height="32" rx="1.25" fill="url(#slateGrad)"/>
      <path d="M7.5 -22 Q7.5 -22 18 -25 L18 -17 Q18 -17 7.5 -14 Z" fill="url(#slateGrad)"/>
    </g>
    
    <!-- Accent dots -->
    <circle cx="18" cy="6" r="2.5" fill="#94A3B8" opacity="0.5"/>
    <circle cx="30" cy="-2" r="2" fill="#CBD5E1" opacity="0.4"/>
  </g>
</svg>